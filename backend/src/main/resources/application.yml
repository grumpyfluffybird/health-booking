spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthbooking}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

app:
  # Múi giờ dùng cho ngày/giờ hẹn khám và "hôm nay"
  timezone: Asia/Ho_Chi_Minh
  booking:
    # Số lịch chưa hủy tối đa trong một khung giờ 30 phút của một bác sĩ
    slot-capacity: 1
  jwt:
    secret: change-this-to-a-very-long-random-secret-key-in-production
    expiration-ms: 86400000  # 24 hours
